spring:
    thymeleaf:
        check-template-location: false

jiovan:
    localization:
        locale-resolver-type: cookie
        locale-interceptor:
            param-name: 'lang'
        cookie-locale-resolver:
            cookie-name: 'locale'
            default-locale: 'en-US'
            http-only: true
